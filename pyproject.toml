[project]
name = "skulk"
version = "1.5.2"
description = "Skulk: distributed AI inference across heterogeneous clusters (Apple Silicon MLX, AMD Vulkan, and NVIDIA CUDA nodes)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "aiofiles>=24.1.0",
  "aiohttp>=3.12.14",
  "types-aiofiles>=24.1.0.20250708",
  "pydantic>=2.12.0",
  "fastapi>=0.116.1",
  "filelock>=3.18.0",
  "rustworkx>=0.17.1",
  "huggingface-hub>=1.8.0",
  "psutil>=7.0.0",
  "loguru>=0.7.3",
  "packaging>=24.0",                                # extension version gating
  "skulk_pyo3_bindings",                            # rust bindings
  "anyio==4.11.0",
  "mlx==0.32.2; sys_platform == 'darwin'",
  "mlx[cpu]==0.32.2; sys_platform == 'linux'",
  "mlx-lm",
  "mlx-optiq[convert]; sys_platform == 'darwin'",
  "tiktoken>=0.12.0",                             # required for kimi k2 tokenizer
  "hypercorn>=0.18.0",
  "openai-harmony>=0.0.8",
  "httpx>=0.28.1",
  "ddgs>=9.6.1",
  "tomlkit>=0.14.0",
  "tuf>=6,<7",
  # mflux: Foxlight fork (see [tool.uv.sources]). Released mflux caps
  # mlx<0.32.0; the fork pins upstream main at the commit that moved to
  # mlx 0.32, unblocking the coordinated MLX stack bump (Tom, 2026-09-05:
  # fork rather than drop or wait). Same ownership doctrine as mlx-lm.
  "mflux",
  "python-multipart>=0.0.21",
  "msgspec>=0.19.0",
  "zstandard>=0.23.0",
  "pyyaml>=6.0.2",
  "types-PyYAML>=6.0.12",
  # 0.6.4 carries server-side audio model loading, MTP/APC fixes, and
  # request-local M-RoPE batching fixes. Skulk narrowly backports its
  # converted-Qwen norm guard; 0.6.5+ requires a separate MLX 0.32 upgrade.
  "mlx-vlm==0.6.17; sys_platform == 'darwin'",
  # Upstream 0.4.3 fails to advance Fish S2's hidden state while generating
  # codebooks, producing fluent but unrelated speech. The Foxlight post-release
  # Upstream mlx-audio: the Foxlight fork (0.4.3 + upstream #693) is retired
  # as of the Lane C stack bump; 0.5.1 carries #693 and everything since.
  "mlx-audio==0.5.1; sys_platform == 'darwin'",
  # HARD dependency of encoded MLX speech output. mlx-audio delegates MP3,
  # FLAC, OGG, and Opus encoding to an ffmpeg executable; the packaged binary
  # keeps those advertised formats working on a fresh install without requiring
  # a separate Homebrew or system package.
  "imageio-ffmpeg>=0.6.0; sys_platform == 'darwin'",
  "transformers>=5.14.0,<6.0.0",
  # HARD dependency of the MLX vision path, not an extra (#614's rule: nothing
  # optional may be load-bearing). transformers 5.x routes every
  # AutoImageProcessor through a torchvision backend, so without this wheel
  # `AutoImageProcessor.from_pretrained` raises and the image never reaches the
  # model. That failure used to be inaudible: the runner caught it, logged a
  # warning, and answered from the text alone, so the model confabulated a
  # fluent description of a picture it had never seen. Pinned to the release
  # paired with the torch mlx-vlm already resolves, so adding image support
  # does not quietly move the torch under the rest of the stack.
  "torchvision==0.28.0; sys_platform == 'darwin'",
  "jsonschema>=4.26.0",
  # Operator cluster identity and authority records use Ed25519 and AES-GCM.
  # This is a direct production dependency: secret storage must not rely on a
  # transitive dependency accidentally keeping cryptography installed.
  "cryptography>=46.0.3",
  # Local operator pairing renders a terminal QR without requiring a browser.
  "qrcode>=8.2",
  "webrtcvad-wheels>=2.0.14,<3",
  # Platform-conditional HARD dependency (#614): nothing optional may be
  # load-bearing. Without this binding an NVIDIA node silently loses VRAM
  # detection, the served-context lift, and hardware attribution (#612). It is
  # a tiny pure-Python NVML binding, inert without an NVIDIA driver, so
  # non-NVIDIA Linux nodes pay only a few kilobytes.
  "nvidia-ml-py>=12.535.108; sys_platform == 'linux'",
  # HARD dependency of the normal installer on macOS and Linux. A fresh Skulk
  # node includes the dashboard without relying on a separately installed
  # Node.js toolchain; --headless is the explicit API-only opt-out.
  "nodejs-wheel-binaries==25.2.1rc0; sys_platform == 'darwin' or sys_platform == 'linux'",
]

[project.scripts]
skulk = "skulk.main:main"
skulk-plugin-service = "skulk.extensions.service_setup:main"
skulk-build-macos-local-network-probe-app = "skulk.connectivity.local_network_probe_app:main"
skulk-macos-local-network-probe = "skulk.connectivity.local_network_probe:main"

# dependencies only required for development
[dependency-groups]
dev = [
  "basedpyright>=1.29.0",
  # starlette >= 1.0 deprecates httpx-backed TestClient; httpx2 is its
  # supported test transport. Production HTTP-client code stays on httpx.
  "httpx2>=2.0",
  "pyinstaller>=6.17.0",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.0.0",
  "pytest-env",
  "ruff>=0.11.13",
]

# mlx[cuda] requires a newer version of mlx. the ideal on linux is: default to mlx[cpu] unless[cuda] specified.
[project.optional-dependencies]
# cuda = [
#     "mlx[cuda]==0.26.3",
# ]
# llama.cpp engine for heterogeneous (non-MLX) GPU nodes, e.g. AMD Strix Halo via
# Vulkan/ROCm. NOTE: a plain `pip install` of this extra builds the CPU backend;
# for a GPU node, install from source with the backend selected at build time,
# e.g. `CMAKE_ARGS="-DGGML_VULKAN=on" pip install llama-cpp-python`, and declare
# the built backends via SKULK_LLAMA_CPP_BACKENDS so the node advertises them.
llama-cpp = [
    "llama-cpp-python>=0.3.3",
]

###
# workspace configuration
###

[tool.uv.workspace]
members = ["rust/skulk_pyo3_bindings", "bench"]

[tool.uv.sources]
skulk_pyo3_bindings = { workspace = true }
# Using official mlx — the RDMA fork (rltakashige/mlx-jaccl-fix-small-recv) doesn't
# build on macOS 26 Metal SDK. The fork's only change is a DSB memory barrier for
# Thunderbolt RDMA GPU coherence, which we don't need (Skulk uses libp2p, not RDMA).
# mlx = { git = "https://github.com/rltakashige/mlx-jaccl-fix-small-recv.git", branch = "address-rdma-gpu-locks", marker = "sys_platform == 'darwin'" }
# Foxlight-owned mlx-lm, reconciled onto upstream main @ 32bb4e68 (2026-09-04,
# Lane C re-fork; branch foxlight/reconcile-main-20260904, fork PR #3).
# Carries exactly two Foxlight deltas upstream never absorbed: the ArraysCache
# leak fix (mx.depends on BatchKVCache.extend) and the DeepSeek-V3.2
# lightning-indexer batch>1 fix. The CVE-2026-5843 gate is upstream code on
# this base. Plan + evidence: foxlight-docs
# initiatives/skulk-engine-refresh/lane-c-reconciliation-plan.md.
mflux = { git = "https://github.com/Foxlight-Foundation/mflux", rev = "051ba9ff25c9a8a8703356053a012a0dfad3fe39" }
mlx-lm = { git = "https://github.com/Foxlight-Foundation/mlx-lm", rev = "587b88aaff5accabf6c5ecb7b4de5e010453dde4" }
# Uncomment to use local mlx/mlx-lm development versions:
# mlx = { path = "/Users/Shared/mlx", editable=true }
# mlx-lm = { path = "/Users/Shared/mlx-lm", editable=true }

[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"

###
# type-checker configuration
###

[tool.basedpyright]
include = [".venv/lib/mlx", ".venv/lib/mlx_lm", "src", "bench"]
typeCheckingMode = "strict"
failOnWarnings = true

reportAny = "error"
reportUnknownVariableType = "error"
reportUnknownParameterType = "error"
reportMissingParameterType = "error"
reportMissingTypeStubs = "error"
reportInvalidCast = "error"
reportUnnecessaryCast = "error"
reportUnnecessaryTypeIgnoreComment = "error"

pythonVersion = "3.13"
pythonPlatform = "Darwin"

exclude = [
  "**/.venv",
  "**/venv",
  "**/__pycache__",
  "**/exo_scripts",
  "**/.direnv",
  "**/rust",
  "**/.github",
]
stubPath = ".mlx_typings"

[[tool.basedpyright.executionEnvironments]]
root = "src"

###
# uv configuration
###

# supported platforms for this project
[tool.uv]
required-version = ">=0.8.6"
prerelease = "allow"
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]
extra-build-dependencies = { "miniaudio" = ["setuptools", "cffi", "pycparser"] }

###
# ruff configuration
###

[tool.ruff]
extend-exclude = [
  "shared/protobufs/**",
  "*mlx_typings/**",
  "rust/skulk_pyo3_bindings/**",
  "bench/vendor/**",
]

[tool.ruff.lint]
extend-select = ["I", "N", "B", "A", "PIE", "SIM"]

[tool.pytest.ini_options]
pythonpath = "."
asyncio_mode = "auto"
markers = ["slow: marks tests as slow (deselected by default)"]
env = ["SKULK_TESTS=1", "SKULK_TESTS=1"]
addopts = "-m 'not slow' --ignore=tests/start_distributed_test.py"
filterwarnings = ["ignore:builtin type Swig:DeprecationWarning"]
