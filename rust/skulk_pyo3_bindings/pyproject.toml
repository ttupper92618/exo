[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "skulk_pyo3_bindings"
# Bumping this version is the ROLLOUT FORCING FUNCTION for wire changes:
# uv sync rebuilds the cached bindings wheel only when this version moves,
# and every installed startup script (old and new) runs uv sync. Bump it in
# the same PR as any NETWORK_VERSION change so nodes rebuild their bindings
# on the FIRST auto-update restart, not the second (#659 review, P1).
version = "0.2.5"
description = "Add your description here"
readme = "README.md"
authors = [
  { name = "Andrei Cravtov", email = "the.andrei.cravtov@gmail.com" },
  { name = "Evan Quiney", email = "evanev7@gmail.com" },
]
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = ["skulk_pyo3_bindings", "pytest>=8.4.0", "pytest-asyncio>=1.0.0"]

[tool.maturin]
#purelib = true
#python-source = "python"
module-name = "skulk_pyo3_bindings"
features = ["pyo3/extension-module", "pyo3/experimental-async"]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
asyncio_mode = "auto"
