[vision]
image_token_id = 163605
model_type = "kimi_vl"
weights_repo = "davehind/Kimi-K2.5-vision"
weights_revision = "3fe5217904599a9583db15320768051b8e12dd72"
processor_repo = "moonshotai/Kimi-K2.5"
