model_id = "mlx-community/Qwen3.5-27B-4bit"
n_layers = 64
hidden_size = 5120
num_key_value_heads = 4
supports_tensor = true
tasks = ["TextGeneration"]
family = "qwen"
quantization = "4bit"
base_model = "Qwen3.5 27B"
capabilities = ["text", "thinking", "thinking_toggle", "vision"]
context_length = 262144

[reasoning]
supports_toggle = true
format = "token_delimited"
default_effort = "medium"
disabled_effort = "none"

# MTP speculative decoding. Depth swept 2026-06-07 on the production
# 2-node pipeline (kite1+kite2, 3x200tok greedy, medians): d1 10.5 vs
# d2 9.2 tok/s against a 6.3 vanilla baseline — depth 1 wins (+67%),
# and d2's wide run-to-run spread (7.7-9.5) was the SSM deferred-replay
# tax: GDN rejects restore a snapshot and ride the next verify, whose
# extra columns cost ~36% of a forward past width 2 (M4 width cliff).
# Same pattern as the 9B; the trunk size does not buy d2 back on GDN
# hybrids. (The 2026-06-05 single-node probe-rig d2 advantage predates
# the cliff measurement and is superseded.)
[runtime]
mtp_heads = true
mtp_max_depth = 1
mtp_sidecar_repo = "FoxlightAI/qwen3-5-27b-mtp"
mtp_sidecar_revision = "facd76d54a6ba6cef3406529b2116b6614d4c1e2"

# Qwen3.5 is a natively multimodal (early-fusion) VLM: config.json ships a
# vision_config and the repo is tagged image-text-to-text /
# AutoModelForMultimodalLM. The MLX vision path splices image embeddings at
# image_token_id, so it is load-bearing here (from config.json).
[modalities]
supports_native_multimodal = true

[vision]
image_token_id = 248056
model_type = "qwen3_5"

[storage_size]
in_bytes = 16054266848
