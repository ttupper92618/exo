model_id = "mlx-community/gemma-3n-E2B-it-4bit"
n_layers = 30
hidden_size = 2048
num_key_value_heads = 2
supports_tensor = false
tasks = ["TextGeneration"]
family = "gemma"
quantization = "4bit"
base_model = "Gemma 3n E2B"
capabilities = ["text", "vision"]
context_length = 32768

# Gemma 3n is Google's on-device omni-modal model (the HF repo tags ASR /
# audio-text-to-text / video-text-to-text alongside image-text-to-text). The
# model can take audio, but Skulk advertises only what the API and runner serve
# today: text + image. Audio input is NOT exposed (the chat-completions request
# schema and the MLX runner don't accept it), so it is omitted from capabilities
# rather than advertised and rejected.
[modalities]
supports_native_multimodal = true

[vision]
image_token_id = 262145
model_type = "gemma3n"
boi_token_id = 255999
eoi_token_id = 262144

[storage_size]
in_bytes = 4502729693

[placement]
# Gemma 3n's MLX artifact runs on the MLX engine. Keep that model truth
# explicit because the split constraint makes this table otherwise non-empty.
compatible_backends = ["mlx"]
# Layers 20-29 reuse KV from concrete producer layers 18 and 19. The final
# pipeline rank must therefore begin no later than layer 18 so it owns both.
max_pipeline_split_layer = 18
