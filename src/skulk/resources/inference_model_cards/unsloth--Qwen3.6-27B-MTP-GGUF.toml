# Qwen3.6-27B (dense) GGUF with built-in multi-token-prediction heads, served via
# the llama_server (served-backend) engine so it can use llama.cpp's native MTP
# speculative decoding (`--spec-type draft-mtp`). This is the only path to native
# MTP on llama.cpp: the MTP orchestration lives in llama-server, not the in-process
# binding. `compatible_backends` is the `llama_server` engine (not `llama_cpp`), so
# placement routes it to a node running llama-server (e.g. kite4 on Vulkan).
#
# Source: unsloth's MTP-preserving GGUF conversion of the official Qwen/Qwen3.6-27B.
# Qwen publishes only safetensors (no GGUF), so an MTP-preserving GGUF must be
# converted by a third party. We point at unsloth's well-provisioned repo rather
# than a small community mirror (the froggeric repo we used earlier is HF-throttled
# to ~1 MB/s, so its 17 GB store download never finalized for reuse). Same base
# model, same MTP heads, same `--spec-type draft-mtp` flag. Unsloth's own run guide
# confirms `--mmproj` and `-np > 1` are unsupported with MTP, matching our served
# TEXT-ONLY, single-sequence path (the base model is a VLM and the repo ships mmproj
# projectors, but the served-MTP path does not load them; vision on llama.cpp is the
# separate #128 path). `supports_tensor = false`: served single-node. Architecture
# values from the GGUF metadata (arch `qwen35`: 65 layers, hidden 5120, 4 KV heads,
# 262144 ctx).
#
# Native MTP on kite4 Radeon (Vulkan) measured ~1.8x to 2.2x on this base model at
# Q4_K_M (draft-mtp n-max 3, ~58% to 72% acceptance); unsloth documents ~1.5x to 2x.
# Tune `served_spec_n_max` from measured acceptance; per-position acceptance decays
# past ~3.
model_id = "unsloth/Qwen3.6-27B-MTP-GGUF"
n_layers = 65
hidden_size = 5120
num_key_value_heads = 4
supports_tensor = false
tasks = ["TextGeneration"]
family = "qwen"
quantization = "Q4_K_M"
base_model = "Qwen3.6 27B"
capabilities = ["text", "thinking", "thinking_toggle"]
context_length = 262144
gguf_file = "Qwen3.6-27B-Q4_K_M.gguf"
trust_remote_code = false

[reasoning]
supports_toggle = true
format = "token_delimited"
default_effort = "medium"
disabled_effort = "none"

[tooling]
supports_tool_calling = true
tool_call_format = "generic"

[runtime]
# Native MTP via llama-server. No draft model needed: the prediction heads ship
# in the GGUF. Only the llama_server engine reads these fields.
served_spec_type = "draft_mtp"
served_spec_n_max = 3

[placement]
compatible_backends = ["llama_server-vulkan", "llama_server-rocm", "llama_server-cuda", "llama_server-cpu"]
backend_preference = ["llama_server-vulkan", "llama_server-rocm", "llama_server-cuda", "llama_server-cpu"]

[storage_size]
in_bytes = 17106773120
