model_id = "mlx-community/gemma-4-12B-it-4bit"
n_layers = 48
hidden_size = 3840
num_key_value_heads = 8
supports_tensor = false
tasks = ["TextGeneration"]
family = "gemma"
quantization = "4bit"
base_model = "Gemma 4 12B"
capabilities = ["text", "thinking"]
context_length = 131072

# The current upstream artifact contains the language model plus projection and
# patch-embedding layers, but no `vision_tower.*` weights. Advertising vision
# would let placement succeed before the runner fails on its first image.
# Re-enable it only after selecting and qualifying a complete immutable revision.

[reasoning]
supports_toggle = true
format = "channel_delimited"
default_effort = "medium"
disabled_effort = "none"

[tooling]
tool_call_format = "gemma4"

[runtime]
prompt_renderer = "gemma4"
output_parser = "gemma4"
# Companion drafter for speculative decoding (Gemma 4 assistant pattern).
# Validated 2026-06-05 on M4/24GB under the bonus-driven cadence: depth 2
# — 77% acceptance, 17.5 tok/s vs 8.6 vanilla (2.03x; depth 1: 85%,
# 1.72x; depth 3: 66%, 1.85x). Pipeline-sharded across 2 nodes (#201
# Track 2b, last-rank drafting): 16.5 tok/s — 95% of single-node
# throughput. gemma4_unified loads via mlx-vlm.
assistant_model_repo = "mlx-community/gemma-4-12B-it-assistant-bf16"
assistant_model_revision = "f36a4c8077baaeca534c5eb38a287fc3b2178ad3"
mtp_max_depth = 2
# Same FAST_SYNCH wedge guard as the other gemma4 cards — GPU command
# queue stalls under the ring backend in pipeline-parallel paths.
metal_fast_synch = false

[storage_size]
in_bytes = 6740867168
