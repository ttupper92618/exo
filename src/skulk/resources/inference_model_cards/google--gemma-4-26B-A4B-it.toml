# Gemma 4 26B A4B Instruct for the vllm served engine (the "wowsers" slate: current-generation
# models serving out of the box). Google's bf16 MoE instruct release (~52 GB): the 80 GB-class
# option in this slate.
# # Model truth vs platform truth notes, mirroring the #635 starter-set
# precedent:
# - The repo is an image-text-to-text architecture; the MODEL supports vision.
#   The vllm runner is text-only in this slice and the vision platform gate
#   ({mlx, llama_cpp} in shared/backends.py) would make a vision-declaring
#   vllm-only card unplaceable, so this card claims text serving only.
#   Restore the vision declaration when the vllm runner gains image input.
# - Tool calling is declared off: the vllm runner does not implement tool
#   dispatch yet (#638); flip to the family default when it lands.
# Architecture facts from the repo's config.json; context_length is the
# config max_position_embeddings. storage_size is the full staging set.
# `supports_tensor = false`: vLLM runs single-node in Skulk.
model_id = "google/gemma-4-26B-A4B-it"
n_layers = 30
hidden_size = 2816
num_key_value_heads = 8
supports_tensor = false
tasks = ["TextGeneration"]
family = "gemma"
quantization = "bf16"
base_model = "Gemma 4 26B A4B Instruct"
capabilities = ["text", "thinking"]
context_length = 262144
trust_remote_code = false

[tooling]
supports_tool_calling = false

[placement]
compatible_backends = ["vllm-cuda", "vllm-rocm"]
backend_preference = ["vllm-cuda", "vllm-rocm"]

[storage_size]
in_bytes = 51644310215
